
name: Label parser tests

on:
  push:
    branches:
      - feature/local-label-camera-ocr
    paths:
      - 'label-import.js'
      - 'label-import-v3.js'
      - 'label-import-ui-state.js'
      - 'label-import-ui.js'
      - 'label-import-ui.css'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/label-parser-tests.yml'

  pull_request:
    paths:
      - 'label-import.js'
      - 'label-import-v3.js'
      - 'label-import-ui-state.js'
      - 'label-import-ui.js'
      - 'label-import-ui.css'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/label-parser-tests.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js parser and import tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check label-import.js
          node --check label-import-v3.js
          node --check label-import-ui-state.js
          node --check label-import-ui.js
          
          node --check app.js
          node --check ingredient-reconstruction.js
          node --check sw.js


      - name: Run all Node.js tests
        run: node --test tests/*.test.js
